services:
  postgres:
    image: postgres:16-alpine
    container_name: chave-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-chave_auth}
      POSTGRES_USER: ${DB_USER:-chave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chave_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ministack:
    image: ${MINISTACK_IMAGE:-ministackorg/ministack}
    container_name: chave-ministack
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    environment:
      SERVICES: ${MINISTACK_SERVICES:-s3,apigateway,sts}
      DEBUG: ${MINISTACK_DEBUG:-0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ministack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  chave-ms-auth:
    build:
      context: ../chave-ms-auth
      dockerfile: Dockerfile
    container_name: chave-ms-auth
    ports:
      - "${MS_AUTH_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-chave}:${DB_PASSWORD:-chave_secret}@postgres:5432/${DB_NAME:-chave_auth}?schema=public
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-chave}
      DB_PASSWORD: ${DB_PASSWORD:-chave_secret}
      DB_NAME: ${DB_NAME:-chave_auth}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me-32-chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      ACCESS_TOKEN_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${JWT_REFRESH_TTL:-7d}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-30m}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-chave_refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/auth/refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-lax}
      REFRESH_COOKIE_MAX_AGE_SECONDS: ${REFRESH_COOKIE_MAX_AGE_SECONDS:-604800}
      FRONTEND_CORS_ORIGINS: ${FRONTEND_CORS_ORIGINS:-http://localhost:${SHELL_PORT:-3000},http://localhost:${MFE_AUTH_PORT:-4001}}
      FRONTEND_ORIGINS: ${FRONTEND_CORS_ORIGINS:-http://localhost:${SHELL_PORT:-3000},http://localhost:${MFE_AUTH_PORT:-4001}}
      CORS_ORIGIN: ${FRONTEND_CORS_ORIGINS:-http://localhost:${SHELL_PORT:-3000},http://localhost:${MFE_AUTH_PORT:-4001}}
      RESET_PASSWORD_FRONTEND_URL: ${RESET_PASSWORD_FRONTEND_URL:-http://localhost:${MFE_AUTH_PORT:-4001}/reset-password}
      FRONTEND_RESET_PASSWORD_URL: ${RESET_PASSWORD_FRONTEND_URL:-http://localhost:${MFE_AUTH_PORT:-4001}/reset-password}
      RESET_PASSWORD_URL: ${RESET_PASSWORD_FRONTEND_URL:-http://localhost:${MFE_AUTH_PORT:-4001}/reset-password}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@chave.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin Chave}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT: http://ministack:4566
      AWS_ENDPOINT_URL: http://ministack:4566
      LOCALSTACK_ENDPOINT: http://ministack:4566
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -f prisma/schema.prisma ]; then
          npx prisma migrate deploy
          npx prisma db seed
        fi
        if node -e "const scripts = require('./package.json').scripts || {}; process.exit(scripts['start:prod'] ? 0 : 1)"; then
          npm run start:prod
        else
          npm run start
        fi
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:3001/health',res=>process.exit(res.statusCode>=200&&res.statusCode<400?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1);});\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  chave-mfe-auth:
    build:
      context: ../chave-mfe-auth
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: ${AUTH_API_PUBLIC_URL:-http://localhost:${MS_AUTH_PORT:-3001}}
        VITE_MS_AUTH_URL: ${AUTH_API_PUBLIC_URL:-http://localhost:${MS_AUTH_PORT:-3001}}
    container_name: chave-mfe-auth
    ports:
      - "${MFE_AUTH_PORT:-4001}:4001"
    environment:
      VITE_AUTH_API_URL: ${AUTH_API_PUBLIC_URL:-http://localhost:${MS_AUTH_PORT:-3001}}
      VITE_MS_AUTH_URL: ${AUTH_API_PUBLIC_URL:-http://localhost:${MS_AUTH_PORT:-3001}}
    depends_on:
      chave-ms-auth:
        condition: service_started
    restart: unless-stopped

  chave-shell:
    build:
      context: ../chave-shell
      dockerfile: Dockerfile
      args:
        MFE_AUTH_URL: ${MFE_AUTH_PUBLIC_REMOTE_URL:-http://localhost:${MFE_AUTH_PORT:-4001}/assets/remoteEntry.js}
        VITE_MFE_AUTH_URL: ${MFE_AUTH_PUBLIC_REMOTE_URL:-http://localhost:${MFE_AUTH_PORT:-4001}/assets/remoteEntry.js}
    container_name: chave-shell
    ports:
      - "${SHELL_PORT:-3000}:3000"
    environment:
      MFE_AUTH_URL: ${MFE_AUTH_PUBLIC_REMOTE_URL:-http://localhost:${MFE_AUTH_PORT:-4001}/assets/remoteEntry.js}
      VITE_MFE_AUTH_URL: ${MFE_AUTH_PUBLIC_REMOTE_URL:-http://localhost:${MFE_AUTH_PORT:-4001}/assets/remoteEntry.js}
    depends_on:
      chave-mfe-auth:
        condition: service_started
    restart: unless-stopped

  infra-provisioner:
    image: hashicorp/terraform:1.8
    container_name: chave-infra-provisioner
    profiles:
      - provision
      - infra-provisioner
    working_dir: /infra
    volumes:
      - ./terraform:/infra
    environment:
      TF_VAR_endpoint: http://ministack:4566
      TF_VAR_region: ${AWS_DEFAULT_REGION:-us-east-1}
      TF_VAR_artifact_bucket: ${TF_VAR_ARTIFACT_BUCKET:-chave-artifacts-local}
      TF_VAR_ms_auth_host: chave-ms-auth
      TF_VAR_ms_auth_port: 3001
    entrypoint: ["/bin/sh", "-c"]
    command: ["terraform init && terraform apply -auto-approve"]
    depends_on:
      ministack:
        condition: service_healthy

volumes:
  postgres_data:
  ministack_data:
